services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: food-order-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - food-order

  nginx:
    image: nginx:alpine
    container_name: food-order-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - food-order

networks:
  food-order:
